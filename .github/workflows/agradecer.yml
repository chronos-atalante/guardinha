name: Agradecer contribuições

# Comenta no PR mesclado agradecendo a pessoa contribuidora.
# Usa pull_request_target porque PRs de fork só têm token de leitura no
# evento pull_request; como não há checkout nem execução de código do fork,
# só a chamada de API, é seguro.
#
# Em 02/11/2026 o GitHub bloqueia pull_request_target por padrão em repositório
# público. O guardinha é público, então este workflow só continua rodando com uma
# política de Ações que permita o evento, e limitada a este arquivo. O comando
# e as conferências estão em docs/build.md.
on:
  pull_request_target:
    types: [closed]

permissions:
  pull-requests: write
  issues: write

jobs:
  agradecer:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.type != 'Bot'
    # Runner fixado, não `ubuntu-latest`: em 19/10/2026 o rótulo `ubuntu-latest`
    # do GitHub passa a apontar para Ubuntu 26.04 (actions/runner-images#14748).
    # O `.deb` da build-deb é o artefato que o usuário instala, e trocar a imagem
    # no meio da linha 1.x mudaria o ambiente de build sem decisão nenhuma.
    # Como sair do 24.04 está em `docs/build.md`.
    runs-on: ubuntu-24.04
    steps:
      - name: Comentar agradecimento
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = [
              `Obrigado, @${pr.user.login}, pela contribuição!`,
              '',
              `Seu PR #${pr.number} (${pr.title}) foi mesclado no Guardinha.`,
              'Ajudou o projeto a ficar melhor para todo mundo que usa.',
              '',
              'Para as próximas mudanças, veja o CONTRIBUTING.md.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
