<!doctype html>
<!--
  Fonte do banner do README (docs/assets/banner.png).

  A capa é a mesma da landing page: paleta de
  Landing-page/src/app/style/globals.css e formas de
  Landing-page/src/components/HomeContent.tsx, com o texto centralizado para
  1280x400. Nada aqui é lógica do app, é só o retrato estático do hero.

  Para regerar: troque ICON_PATH pelo caminho do build/icon.png e capture com
  o Chromium do Electron (BrowserWindow 1280x400, useContentSize, e
  `webContents.capturePage().toPNG()`). Sem isso o PNG do banner não tem
  procedência rastreável, e é o único artefato do repositório que não sai de
  nenhum código.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      /* Paleta e formas de Landing-page/src/app/style/globals.css e
         HomeContent.tsx (capa do hero). ViewBox 1280x400 = 1:1 com o
         banner, então as formas caem no tamanho do site sem escala. */
      :root {
        --bg: #020617;
        --surface: #0f172a;
        --border: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #34d399;
        --accent-strong: #10b981;
        --vivid: #2dd4bf;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 400px;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        position: relative;
      }
      .glow-a,
      .glow-b {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
      }
      .glow-a {
        width: 660px;
        height: 440px;
        left: -180px;
        top: -200px;
        background: radial-gradient(circle, rgba(52, 211, 153, 0.18), transparent 70%);
      }
      .glow-b {
        width: 600px;
        height: 420px;
        right: -160px;
        bottom: -220px;
        background: radial-gradient(circle, rgba(45, 212, 191, 0.15), transparent 70%);
      }
      .deco {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .wrap {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 0 420px;
      }
      .icon-frame {
        border-radius: 22px;
        border: 1px solid rgba(52, 211, 153, 0.3);
        background: rgba(52, 211, 153, 0.1);
        padding: 8px;
        margin-bottom: 16px;
      }
      .icon-frame img {
        width: 72px;
        height: 72px;
        border-radius: 15px;
        display: block;
      }
      h1 {
        font-size: 52px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }
      .intro {
        margin-top: 12px;
        font-size: 18px;
        color: var(--muted);
        max-width: 640px;
        line-height: 1.55;
      }
      .intro strong {
        color: var(--accent);
        font-weight: 600;
      }
      .badges {
        margin-top: 22px;
        display: flex;
        gap: 9px;
      }
      .chip {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 8px;
        padding: 6px 13px;
      }
      .chip-accent {
        color: var(--accent);
        border-color: rgba(52, 211, 153, 0.32);
        background: rgba(52, 211, 153, 0.08);
      }
    </style>
  </head>
  <body>
    <div class="glow-a"></div>
    <div class="glow-b"></div>

    <!-- Formas da capa, espalhadas pelas bordas e bem apagadas: a coluna de
         texto tem que ser a protagonista. -->
    <svg class="deco" viewBox="0 0 1280 400" aria-hidden="true">
      <!-- Cadeado (esquerda, alto) -->
      <g opacity="0.5">
        <path
          d="M104 74 V58 a24 24 0 0 1 48 0 V74"
          fill="none"
          stroke="#34d399"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.30"
        />
        <rect x="90" y="72" width="76" height="58" rx="13" fill="rgba(52,211,153,0.09)" />
        <circle cx="128" cy="94" r="5.5" fill="rgba(52,211,153,0.30)" />
        <path d="M124.5 98 h7 l2.6 15 h-12.2 Z" fill="rgba(52,211,153,0.30)" />
      </g>

      <!-- Chave (direita, alto) -->
      <g transform="rotate(18 1112 78)" opacity="0.5">
        <circle
          cx="1062"
          cy="78"
          r="22"
          fill="none"
          stroke="#10b981"
          stroke-width="10"
          opacity="0.30"
        />
        <path
          d="M1084 78 H1180"
          fill="none"
          stroke="#10b981"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.30"
        />
        <path
          d="M1156 78 V104"
          fill="none"
          stroke="#10b981"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.30"
        />
        <path
          d="M1180 78 V97"
          fill="none"
          stroke="#10b981"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.30"
        />
      </g>

      <!-- Asterisco (direita, meio) -->
      <g opacity="0.45">
        <rect x="1204" y="186" width="17" height="74" rx="8.5" fill="rgba(45,212,191,0.16)" />
        <rect
          x="1204"
          y="186"
          width="17"
          height="74"
          rx="8.5"
          fill="rgba(45,212,191,0.16)"
          transform="rotate(60 1212.5 223)"
        />
        <rect
          x="1204"
          y="186"
          width="17"
          height="74"
          rx="8.5"
          fill="rgba(45,212,191,0.16)"
          transform="rotate(120 1212.5 223)"
        />
      </g>

      <!-- Triângulo (esquerda, baixo) -->
      <path d="M232 348 L268 280 L196 280 Z" fill="rgba(45,212,191,0.10)" />

      <!-- Furo de fechadura (direita, baixo) -->
      <g opacity="0.5">
        <circle
          cx="1112"
          cy="318"
          r="34"
          fill="none"
          stroke="#34d399"
          stroke-width="2.2"
          opacity="0.26"
        />
        <circle cx="1112" cy="312" r="8" fill="rgba(52,211,153,0.28)" />
        <path d="M1108 316 h8 l3 18 h-14 Z" fill="rgba(52,211,153,0.28)" />
      </g>

      <!-- Senha mascarada (esquerda, meio-baixo) -->
      <g opacity="0.5">
        <rect
          x="52"
          y="286"
          width="132"
          height="42"
          rx="13"
          fill="none"
          stroke="rgba(52,211,153,0.26)"
          stroke-width="2.6"
        />
        <circle cx="74" cy="307" r="6" fill="rgba(52,211,153,0.28)" />
        <circle cx="104" cy="307" r="6" fill="rgba(52,211,153,0.28)" />
        <circle cx="134" cy="307" r="6" fill="rgba(52,211,153,0.28)" />
        <circle cx="164" cy="307" r="6" fill="rgba(52,211,153,0.28)" />
      </g>
    </svg>

    <div class="wrap">
      <div class="icon-frame">
        <img src="ICON_PATH" alt="" />
      </div>
      <h1>Guardinha</h1>
    </div>
  </body>
</html>
